[package]
name = "evm-scanner"
version = "0.1.0"
edition = "2021"
description = "EVM bytecode scanner for flash loan and reentrancy vulnerability detection using Jaccard similarity"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
clap = { version = "=4.5.23", features = ["derive"] }
clap_derive = "=4.5.18"
reqwest = { version = "0.11", features = ["json", "blocking"] }

[[bin]]
name = "evm-scanner"
path = "src/main.rs"
